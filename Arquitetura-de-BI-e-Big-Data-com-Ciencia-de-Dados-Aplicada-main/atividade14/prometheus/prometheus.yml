global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "kafka_producer"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "ecommerce_api"
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "spark_streaming"
    static_configs:
      - targets: ["host.docker.internal:8003"]
